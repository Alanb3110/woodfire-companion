name: Restore index version

on:
  push:
    branches:
      - feature/barbacoa-executable-meal
    paths:
      - .github/workflows/restore-index-version.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/barbacoa-executable-meal
          fetch-depth: 0
      - name: Restore index from main and bump display version
        run: |
          git fetch origin main
          git show origin/main:index.html > index.html
          sed -i 's/DEV · v0.3.0-dev.8/DEV · v0.3.0-dev.9/' index.html
      - name: Commit restored index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore complete index for dev.9"
          git push
