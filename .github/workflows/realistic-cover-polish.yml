name: Realistic cover polish

on:
  push:
    branches:
      - feature/illustrated-recipe-library
    paths:
      - .github/workflows/realistic-cover-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/illustrated-recipe-library
      - name: Update docs and remove obsolete SVG artwork
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'README.md': [
              ('local illustrated SVG covers for every executable recipe, reused in cards and recipe heroes;',
               'local realistic WebP covers for every executable recipe, reused in cards and recipe heroes;')
            ],
            'sources/TECHNICAL_CONTEXT.md': [
              ('The library now uses manifest-driven local SVG covers through `visual.imageUrl`.',
               'The library now uses manifest-driven local WebP food covers through `visual.imageUrl`.')
            ]
          }
          for path, pairs in replacements.items():
              p = Path(path)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'marker not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              p.write_text(text)
          PY
          git rm assets/recipes/pork-belly-burnt-ends.svg \
                 assets/recipes/sweet-savory-turkey-zucchini-gratin.svg \
                 assets/recipes/smoked-beef-barbacoa.svg
      - name: Commit final cover assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md sources/TECHNICAL_CONTEXT.md assets/recipes
          git diff --cached --quiet && exit 0
          git commit -m "feat: replace illustrated covers with realistic food imagery"
          git push
