name: Optional temperature codemod

on:
  push:
    branches:
      - feature/optional-temperature-tracking
    paths:
      - .github/workflows/optional-temperature-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/optional-temperature-tracking
      - name: Apply codemod
        run: python .github/optional_temperature_codemod.py
      - name: Validate syntax
        run: |
          node --check app.js
          node --check js/recipe.js
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js js/recipe.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: hide temperature tracking when recipe disables it"
          git push
