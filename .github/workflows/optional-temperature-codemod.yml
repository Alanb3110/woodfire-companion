name: Optional temperature docs sync

on:
  push:
    branches:
      - feature/optional-temperature-tracking
    paths:
      - .github/workflows/optional-temperature-codemod.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/optional-temperature-tracking
      - name: Update source contracts
        run: python .github/optional_temperature_codemod.py
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/RECIPE_SCHEMA_V1.md sources/TECHNICAL_CONTEXT.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: define optional temperature tracking"
          git push
