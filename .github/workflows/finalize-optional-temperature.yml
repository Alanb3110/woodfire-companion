name: Finalize optional temperature

on:
  push:
    branches:
      - feature/optional-temperature-tracking
    paths:
      - .github/workflows/finalize-optional-temperature.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/optional-temperature-tracking
      - name: Apply final patch
        run: python .github/finalize_optional_temperature.py
      - name: Validate
        run: |
          node --check js/recipe.js
          npm test
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Alanb3110@users.noreply.github.com"
          git add styles.css js/recipe.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: finalize optional temperature tracking"
          git push
