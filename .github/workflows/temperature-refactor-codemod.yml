name: Temperature refactor codemod

on:
  push:
    branches:
      - refactor/temperature-module
    paths:
      - .github/workflows/temperature-refactor-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/temperature-module
      - name: Extract temperature wiring from app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.js')
          text = path.read_text()

          text = text.replace(
              "} from './js/session.js';\n\nconst LIBRARY_URL",
              "} from './js/session.js';\nimport { createTemperatureController } from './js/temperature-ui.js';\n\nconst LIBRARY_URL",
              1,
          )

          old_refs = """const temperatureInput = $('temperatureInput');
          const addTemperatureBtn = $('addTemperatureBtn');
          const tempValidation = $('tempValidation');
          const targetTemperature = $('targetTemperature');
          const lastTemperature = $('lastTemperature');
          const lastTemperatureTime = $('lastTemperatureTime');
          const measurementCount = $('measurementCount');
          const chartContainer = $('chartContainer');
          const measurementList = $('measurementList');
          const undoMeasurementBtn = $('undoMeasurementBtn');
          const newCookBtn = $('newCookBtn');
          const exportCsvBtn = $('exportCsvBtn');
          """
          if old_refs not in text:
              raise SystemExit('Temperature DOM reference block not found.')
          text = text.replace(old_refs, '', 1)

          marker = "const installDialog = $('installDialog');\n"
          controller = """
          const temperatureController = createTemperatureController({
            elements: {
              input: $('temperatureInput'),
              addButton: $('addTemperatureBtn'),
              validation: $('tempValidation'),
              targetInput: $('targetTemperature'),
              lastValue: $('lastTemperature'),
              lastTime: $('lastTemperatureTime'),
              count: $('measurementCount'),
              chart: $('chartContainer'),
              list: $('measurementList'),
              undoButton: $('undoMeasurementBtn'),
              newSeriesButton: $('newCookBtn'),
              exportButton: $('exportCsvBtn')
            },
            getState: () => state,
            getDefaultTarget: () => recipe?.temperature?.defaultTargetC || 93,
            commit: () => {
              saveState();
              syncJournal();
            },
            formatTime,
            confirmAction: message => confirm(message)
          });
          """
          if marker not in text:
              raise SystemExit('installDialog marker not found.')
          text = text.replace(marker, marker + controller, 1)

          old_activate = "  renderTasks();\n  renderTemperature();\n  switchTab(state.activeTab || 'planning', false);"
          new_activate = "  renderTasks();\n  temperatureController.render();\n  switchTab(state.activeTab || 'planning', false);"
          if old_activate not in text:
              raise SystemExit('activateRecipe temperature render call not found.')
          text = text.replace(old_activate, new_activate, 1)

          old_focus = "if (tabName === 'temperature' && !cookView.hidden) temperatureInput.focus();"
          new_focus = "if (tabName === 'temperature' && !cookView.hidden) temperatureController.focus();"
          if old_focus not in text:
              raise SystemExit('temperature tab focus line not found.')
          text = text.replace(old_focus, new_focus, 1)

          text, count = re.subn(
              r"\nfunction validateTemperature\(raw\) \{.*?(?=\nfunction bindEvents\(\) \{)",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Legacy temperature function block was not removed exactly once.')

          text, count = re.subn(
              r"\n  addTemperatureBtn\.addEventListener\('click', addTemperature\);.*?\n  exportCsvBtn\.addEventListener\('click', exportCsv\);",
              "\n  temperatureController.bind();",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Legacy temperature event block was not replaced exactly once.')

          forbidden = [
              'function validateTemperature(',
              'function renderTemperature(',
              'function renderChart(',
              'function exportCsv(',
              'addTemperatureBtn.addEventListener',
              'temperatureInput.focus()'
          ]
          remaining = [item for item in forbidden if item in text]
          if remaining:
              raise SystemExit(f'Legacy temperature wiring remains: {remaining}')

          path.write_text(text)
          PY
          node --check app.js
      - name: Commit refactor result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: wire extracted temperature controller"
          git push
